[project]
name = "athlete-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "supabase>=2.10",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "google-adk==2.13.0",
    "litellm==1.106.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ingest/tests", "coach/tests"]
